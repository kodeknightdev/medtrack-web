<div class="page-header">
  <h1>Appointments</h1>
</div>

<h2>{{ current | date:'MMMM y' }}</h2>

<div class="calendar card">
  <div class="weekday" *ngFor="let d of weekdays">{{ d }}</div>
  <ng-container *ngFor="let week of weeks">
    <div class="day" *ngFor="let day of week" [class.other-month]="!day.inMonth" [class.today]="day.isToday">
      <span class="date">{{ day.date.getDate() }}</span>
      <span class="appt" *ngFor="let a of day.appointments">{{ a.startsAt | date:'HH:mm' }} {{ a.title }}</span>
    </div>
  </ng-container>
</div>
