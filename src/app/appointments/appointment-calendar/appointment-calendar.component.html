<div class="page-header">
  <h1>Appointments</h1>
  <a routerLink="new" class="btn">New appointment</a>
</div>

<div class="month-nav">
  <button type="button" class="btn btn-secondary btn-sm" (click)="previousMonth()">&lsaquo;</button>
  <h2>{{ current | date:'MMMM y' }}</h2>
  <button type="button" class="btn btn-secondary btn-sm" (click)="nextMonth()">&rsaquo;</button>
  <button type="button" class="btn btn-secondary btn-sm" (click)="today()">Today</button>
</div>

<div class="calendar card">
  <div class="weekday" *ngFor="let d of weekdays">{{ d }}</div>
  <ng-container *ngFor="let week of weeks">
    <div class="day" *ngFor="let day of week" [class.other-month]="!day.inMonth" [class.today]="day.isToday">
      <span class="date">{{ day.date.getDate() }}</span>
      <a class="appt" *ngFor="let a of day.appointments" [routerLink]="[a.id, 'edit']">{{ a.startsAt | date:'HH:mm' }} {{ a.title }}</a>
    </div>
  </ng-container>
</div>
