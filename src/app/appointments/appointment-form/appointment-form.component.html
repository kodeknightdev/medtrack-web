<h1>{{ editingId ? 'Edit appointment' : 'New appointment' }}</h1>

<form [formGroup]="form" (ngSubmit)="save()" class="card" novalidate>
  <div class="form-field">
    <label for="title">Title</label>
    <input id="title" formControlName="title" placeholder="e.g. GP check-up">
    <app-field-error [control]="form.get('title')" label="Title"></app-field-error>
  </div>

  <div class="form-row">
    <div class="form-field">
      <label for="provider">With</label>
      <input id="provider" formControlName="provider">
      <app-field-error [control]="form.get('provider')" label="With"></app-field-error>
    </div>
    <div class="form-field">
      <label for="location">Where</label>
      <input id="location" formControlName="location">
      <app-field-error [control]="form.get('location')" label="Where"></app-field-error>
    </div>
  </div>

  <div class="form-row">
    <div class="form-field">
      <label for="startsAt">Starts</label>
      <input id="startsAt" type="datetime-local" formControlName="startsAt" (change)="onStartChange()">
      <app-field-error [control]="form.get('startsAt')" label="Starts"></app-field-error>
    </div>
    <div class="form-field">
      <label for="endsAt">Ends</label>
      <input id="endsAt" type="datetime-local" formControlName="endsAt">
      <app-field-error [control]="form.get('endsAt')" label="Ends"></app-field-error>
    </div>
  </div>
  <div class="form-error" *ngIf="form.errors?.dateRange && form.get('endsAt').touched">
    The appointment has to end after it starts.
  </div>

  <div class="form-field">
    <label for="notes">Notes</label>
    <textarea id="notes" formControlName="notes"></textarea>
    <app-field-error [control]="form.get('notes')" label="Notes"></app-field-error>
  </div>

  <div class="form-error" *ngIf="error">{{ error }}</div>

  <div class="form-actions">
    <button type="submit" class="btn" [disabled]="saving">Save</button>
    <a routerLink="/appointments" class="btn btn-secondary">Cancel</a>
    <button type="button" class="btn btn-danger" *ngIf="editingId" (click)="delete()">Delete</button>
  </div>
</form>
