<nav class="nav">
  <a routerLink="/" class="brand">MedTrack</a>
  <button type="button" class="menu-toggle" (click)="menuOpen = !menuOpen" aria-label="Toggle menu">&#9776;</button>
  <div class="links" [class.open]="menuOpen">
    <a routerLink="/timeline" routerLinkActive="active" (click)="closeMenu()">Timeline</a>
    <a routerLink="/symptoms" routerLinkActive="active" (click)="closeMenu()">Symptoms</a>
    <a routerLink="/medications" routerLinkActive="active" (click)="closeMenu()">Medications</a>
    <a routerLink="/appointments" routerLinkActive="active" (click)="closeMenu()">Appointments</a>
  </div>
  <div class="user" *ngIf="user$ | async as email; else signIn">
    <span class="email">{{ email }}</span>
    <button type="button" class="btn btn-secondary btn-sm" (click)="logout()">Log out</button>
  </div>
  <ng-template #signIn>
    <a routerLink="/login" class="btn btn-sm">Log in</a>
  </ng-template>
</nav>
