<div class="page-header">
  <h1>Symptoms</h1>
  <a routerLink="new" class="btn">Log symptom</a>
</div>

<p class="muted" *ngIf="loading">Loading&hellip;</p>

<div class="empty-state" *ngIf="!loading && symptoms.length === 0">
  Nothing logged yet. When something comes up, <a routerLink="new">log it here</a>.
</div>

<div class="card symptom" *ngFor="let s of symptoms">
  <span class="badge" [ngClass]="severityClass(s.severity)">{{ s.severity }}</span>
  <div class="body">
    <strong>{{ s.name }}</strong>
    <div class="when muted">{{ s.occurredAt | date:'EEE d MMM y, HH:mm' }}</div>
    <p class="notes" *ngIf="s.notes">{{ s.notes }}</p>
  </div>
    <div class="actions">
      <a [routerLink]="[s.id, 'edit']" class="btn btn-secondary btn-sm">Edit</a>
      <button type="button" class="btn btn-danger btn-sm" (click)="delete(s)">Delete</button>
    </div>
</div>
