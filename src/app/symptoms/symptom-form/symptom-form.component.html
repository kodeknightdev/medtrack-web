<h1>{{ editingId ? 'Edit symptom' : 'Log a symptom' }}</h1>

<form [formGroup]="form" (ngSubmit)="save()" class="card" novalidate>
  <div class="form-field">
    <label for="name">What</label>
    <input id="name" formControlName="name" placeholder="e.g. Headache">
    <div class="field-error" *ngIf="form.get('name').touched && form.get('name').errors?.required">What is required.</div>
    <div class="field-error" *ngIf="form.get('name').touched && form.get('name').errors?.maxlength">Keep it under 100 characters.</div>
  </div>

  <div class="form-field">
    <label for="severity">Severity</label>
    <input id="severity" type="range" min="1" max="10" formControlName="severity"><span class="severity-value">{{ form.value.severity }}/10</span>
    <div class="field-error" *ngIf="form.get('severity').touched && form.get('severity').errors?.min">Severity must be between 1 and 10.</div>
    <div class="field-error" *ngIf="form.get('severity').touched && form.get('severity').errors?.max">Severity must be between 1 and 10.</div>
  </div>

  <div class="form-field">
    <label for="occurredAt">When</label>
    <input id="occurredAt" type="datetime-local" formControlName="occurredAt">
    <div class="field-error" *ngIf="form.get('occurredAt').touched && form.get('occurredAt').errors?.required">When is required.</div>
  </div>

  <div class="form-field">
    <label for="notes">Notes</label>
    <textarea id="notes" formControlName="notes"></textarea>
    <div class="field-error" *ngIf="form.get('notes').touched && form.get('notes').errors?.maxlength">Notes must be under 1000 characters.</div>
  </div>

  <div class="form-error" *ngIf="error">{{ error }}</div>

  <div class="form-actions">
    <button type="submit" class="btn" [disabled]="saving">Save</button>
    <a routerLink="/symptoms" class="btn btn-secondary">Cancel</a>
  </div>
</form>
