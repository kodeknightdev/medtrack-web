<div class="auth card">
  <h1>Log in</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username">
      <div class="field-error" *ngIf="form.get('email').touched && form.get('email').errors?.required">Email is required.</div>
      <div class="field-error" *ngIf="form.get('email').touched && form.get('email').errors?.email">Enter a valid email address.</div>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password">
      <div class="field-error" *ngIf="form.get('password').touched && form.get('password').errors?.required">Password is required.</div>
    </div>

    <div class="form-error" *ngIf="error">{{ error }}</div>

    <button type="submit" class="btn" [disabled]="busy">Log in</button>
  </form>

  <p class="muted">No account yet? <a routerLink="/register">Create one</a>.</p>
</div>
