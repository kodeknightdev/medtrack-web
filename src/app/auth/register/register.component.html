<div class="auth card">
  <h1>Create an account</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username">
      <app-field-error [control]="form.get('email')" label="Email"></app-field-error>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password">
      <app-field-error [control]="form.get('password')" label="Password"></app-field-error>
    </div>

    <div class="form-error" *ngIf="error">{{ error }}</div>

    <button type="submit" class="btn" [disabled]="busy">Create account</button>
  </form>

  <p class="muted">Already registered? <a routerLink="/login">Log in</a>.</p>
</div>
